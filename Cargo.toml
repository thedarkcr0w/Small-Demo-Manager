[package]
name = "small-demo-manager"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
description = "Native CS2 demo library and per-player voice extractor"
license-file = "LICENSE"
repository = "https://github.com/thedarkcr0w/Small-Demo-Manager"
default-run = "SmallDemoManager"

[[bin]]
name = "SmallDemoManager"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "x11", "wayland"] }
egui_extras = { version = "0.37", features = ["image"] }
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
notify = "8"
open = "5"
opus = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.17"
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
source2-demo = { version = "=0.5.10", path = "vendor/source2-demo", default-features = false, features = ["cs2"] }
tempfile = "3"
trash = "5"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
unwrap_used = "warn"
